[project]
name = "qualydata-hackaton"
version = "0.1.0"
description = "Narrativas y coordinación a escala: pipeline del desafío QualyData (Hackathon Argentina Space 2026)"
readme = "README.md"
authors = [
    { name = "Emiliano Flores", email = "def.emiliano@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0,<2",
    "networkx>=3.1",
    "numpy>=1.24",
    "pandas>=2.0,<3.1",
    "plotly>=5",
    "psutil>=5.9",
    "pyyaml>=6",
    "scikit-learn>=1.3",
    "sentence-transformers>=6.3.0",
]

# uv solo maneja el entorno y las dependencias: el pipeline se ejecuta desde la raíz
# con `python -m qd.pipeline` (o `make`), no se instala como paquete.
[tool.uv]
package = false
