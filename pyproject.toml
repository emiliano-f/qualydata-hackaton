[project]
name = "qualydata-hackaton"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Emiliano Flores", email = "def.emiliano@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.0,<2",
    "numpy>=1.24",
    "pandas>=2.0,<3.1",
    "psutil>=5.9",
    "pyyaml>=6",
    "scikit-learn>=1.3",
]

[project.scripts]
qualydata-hackaton = "qualydata_hackaton:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
